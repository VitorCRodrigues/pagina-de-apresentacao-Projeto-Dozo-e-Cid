# XcodeGen spec. Generate with `xcodegen generate` (macOS only; the CI does it).
# The generated OpenDollars.xcodeproj is never committed (see .gitignore).
name: OpenDollars

options:
  bundleIdPrefix: com.opendollars
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Simulator builds are signed to run locally (no team needed); the Keychain requires a signature.
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

packages:
  OpenDollarsCore:
    path: OpenDollarsCore

targets:
  OpenDollars:
    type: application
    platform: iOS
    sources:
      - path: OpenDollars
    dependencies:
      - package: OpenDollarsCore
        product: OpenDollarsCore
    info:
      path: OpenDollars/Info.plist
      properties:
        CFBundleDisplayName: OpenDollars
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, pt, en]
        UIAppFonts: [InterVariable.ttf]
        # TODO(decisão) 17: NSCameraUsageDescription comes in with the
        # document upload; its text is already in InfoPlist.xcstrings. No Face ID in the pilot (22).
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The brand has a light palette only (web/src/styles/tokens.css has no dark theme). Locked
        # to light so the keyboard, pickers, sheets and bars never turn dark over the cream page.
        # TODO(decisão) 8: a dark theme, if ever, together with the web (docs/decisions.md).
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opendollars.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # TODO(decisão): no app icon in phase 0; the official vector logo is pending. XcodeGen
        # defaults this to "AppIcon", which fails the build without an icon set. Required before
        # any TestFlight or App Store build.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  OpenDollarsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OpenDollarsUITests
    dependencies:
      - target: OpenDollars
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opendollars.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OpenDollars
        # XCTest UI APIs and Swift 6 strict isolation still clash in places; the UI tests hold no
        # app logic, so they compile in Swift 5 mode.
        SWIFT_VERSION: "5.0"

schemes:
  OpenDollars:
    build:
      targets:
        OpenDollars: all
        OpenDollarsUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - OpenDollarsUITests
